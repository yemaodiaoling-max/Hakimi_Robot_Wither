<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>哈基米 · 视频活动</title>
  <script defer src="/panel-shell.js"></script>
  <link rel="stylesheet" href="/panel-shell.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/activity.css">
</head>
<body>
<main class="page activity-page">
  <header class="page-head">
    <div>
      <h1>视频活动</h1>
      <p>B 站上实际看过的视频、读到的 QQ 共享记忆和评论尝试。片段记录才是观察依据；“结束观看”不代表完整看完。</p>
    </div>
    <div class="toolbar">
      <p id="updated" class="meta" role="status">正在读取…</p>
      <button id="refresh" class="btn" type="button">刷新</button>
    </div>
  </header>

  <div id="runtime" class="status-strip"></div>

  <nav class="section-nav" aria-label="分区">
    <a href="#videos-heading">视频记录</a>
    <a href="#memory-heading">QQ 共享记忆</a>
    <a href="#comments-heading">评论尝试</a>
    <span class="meta">最近 30 天 · 每类最多 100 条</span>
  </nav>

  <section class="card feed">
    <h2 id="videos-heading" class="card-title">视频记录</h2>
    <p class="card-sub">选片理由是模型自述；上下文标签只表示摘要曾提供给模型，不证明它导致了选择。</p>
    <div id="videos" class="feed-list"></div>
    <details id="pending" class="fold"><summary>未形成观看记录的选片</summary><div id="unwatched" class="feed-list"></div></details>
  </section>

  <section class="card feed">
    <h2 id="memory-heading" class="card-title">QQ 共享记忆</h2>
    <p class="card-sub">只展示允许共享的摘记。点击标签查看正文；过期、撤回或更新的修订不展示旧正文。</p>
    <div id="memory" class="feed-list"></div>
    <details id="context-library" class="fold"><summary>选片引用的共享摘记</summary><div id="context-details"></div></details>
  </section>

  <section class="card feed">
    <h2 id="comments-heading" class="card-title">评论尝试</h2>
    <p class="notice">“平台已受理”不代表已公开可见；“结果未知”不能当作成功。</p>
    <div id="comments" class="feed-list"></div>
  </section>
</main>
<script src="/activity.js"></script>
</body>
</html>
